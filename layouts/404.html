{{ define "main" }}

<main class="custom-404">

    <div class="error-code">404</div>

    <p class="error-label">
        PAGE NOT FOUND
    </p>

    <h1>
        This page seems to have moved.
    </h1>

    <p class="error-description">
        The requested page may have been renamed, removed,
        or the address may be incorrect.
    </p>

    <div class="error-actions">

        <a class="primary-action" href="/">
            Return Home
        </a>

        <a class="secondary-action" href="/projects/">
            Explore Projects
        </a>

        <a class="secondary-action" href="/contact/">
            Contact Me
        </a>

    </div>

</main>

{{ end }}
